<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #00ff66;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 25px;
      font-size: 28px;
    }

    #camera {
      width: 90%;
      max-width: 700px;
      border: 2px solid #00ff66;
      border-radius: 15px;
      transform: scaleX(-1);
    }

    #result {
      font-size: 32px;
      font-weight: bold;
      margin-top: 20px;
    }

    #fingers {
      font-size: 18px;
      margin-top: 10px;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #00ff66;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>HAND GESTURE</h1>

  <video id="camera" autoplay playsinline></video>

  <div id="result">Tekan tombol untuk mulai</div>
  <div id="fingers">Fingers: -</div>

  <button onclick="startCamera()">START CAMERA</button>

  <script>
    const video = document.getElementById("camera");
    const result = document.getElementById("result");
    const fingersText = document.getElementById("fingers");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        result.innerText = "Camera aktif!";
        fingersText.innerText = "Fingers: belum dideteksi";

      } catch (error) {
        result.innerText = "Kamera tidak bisa dibuka";
        console.error(error);
      }
    }
  </script>

</body>
</html>
