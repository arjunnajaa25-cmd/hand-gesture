<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Hand Gesture</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background:
        radial-gradient(
            circle at center,
            #101b30 0%,
            #050914 55%,
            #02040a 100%
        );

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    min-height: 100vh;

    overflow-x: hidden;
}


.container {

    width: 100%;

    max-width: 900px;

    margin: auto;

    padding: 20px;

    text-align: center;

}


h1 {

    margin: 5px 0 4px;

    font-size: 30px;

    letter-spacing: 3px;

    color: #00e5ff;

    text-shadow:
        0 0 10px rgba(0,229,255,.6),
        0 0 25px rgba(0,229,255,.25);

}


.subtitle {

    color: #8391aa;

    font-size: 14px;

    margin-bottom: 20px;

}


.camera-box {

    position: relative;

    width: 100%;

    border-radius: 22px;

    overflow: hidden;

    background: #02050b;

    border: 1px solid #1c4055;

    box-shadow:

        0 0 30px
        rgba(0,229,255,.12),

        inset 0 0 30px
        rgba(0,229,255,.05);

}


video {

    width: 100%;

    display: block;

    transform: scaleX(-1);

}


canvas {

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    transform: scaleX(-1);

    pointer-events: none;

}


.scanner {

    position: absolute;

    left: 0;

    width: 100%;

    height: 2px;

    background: #00e5ff;

    box-shadow:
        0 0 12px #00e5ff,
        0 0 25px #00e5ff;

    animation: scan 2.8s linear infinite;

    opacity: .45;

    pointer-events: none;

}


@keyframes scan {

    0% {
        top: 0%;
    }

    50% {
        top: 100%;
    }

    100% {
        top: 0%;
    }

}


.corner {

    position: absolute;

    width: 28px;

    height: 28px;

    border-color: #00e5ff;

    z-index: 5;

    pointer-events: none;

}


.tl {

    top: 12px;

    left: 12px;

    border-top: 2px solid;

    border-left: 2px solid;

}


.tr {

    top: 12px;

    right: 12px;

    border-top: 2px solid;

    border-right: 2px solid;

}


.bl {

    bottom: 12px;

    left: 12px;

    border-bottom: 2px solid;

    border-left: 2px solid;

}


.br {

    bottom: 12px;

    right: 12px;

    border-bottom: 2px solid;

    border-right: 2px solid;

}


.result {

    margin-top: 18px;

    padding: 20px;

    border-radius: 18px;

    background:
        rgba(8,16,31,.92);

    border: 1px solid #1c4055;

    box-shadow:
        0 0 25px
        rgba(0,229,255,.08);

}


.detected {

    font-size: 27px;

    font-weight: bold;

    color: #00e5ff;

    min-height: 35px;

    text-transform: uppercase;

    text-shadow:
        0 0 10px
        rgba(0,229,255,.55);

}


.status {

    margin-top: 10px;

    color: #8492aa;

    font-size: 13px;

}


button {

    margin-top: 18px;

    padding: 14px 28px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #00bcd4,
            #007c91
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    letter-spacing: 1px;

    box-shadow:
        0 0 18px
        rgba(0,229,255,.25);

}


button:active {

    transform: scale(.97);

}


.info {

    margin-top: 18px;

    padding: 16px;

    border-radius: 15px;

    background:
        rgba(8,14,27,.8);

    border: 1px solid #17273d;

    color: #9aa8bd;

    font-size: 14px;

    line-height: 1.9;

}


.system {

    margin-top: 14px;

    font-size: 12px;

    color: #52647e;

}


.online {

    color: #00ff99;

}


</style>

</head>


<body>


<div class="container">


<h1>
AI HAND GESTURE
</h1>


<div class="subtitle">
REAL-TIME COMPUTER VISION
</div>


<div class="camera-box">


<video
id="video"
autoplay
playsinline>
</video>


<canvas id="canvas"></canvas>


<div class="scanner"></div>


<div class="corner tl"></div>

<div class="corner tr"></div>

<div class="corner bl"></div>

<div class="corner br"></div>


</div>


<div class="result">


<div
id="detected"
class="detected">

Menunggu gesture...

</div>


<div
id="status"
class="status">

Tekan START CAMERA untuk memulai

</div>


<button
id="startButton"
onclick="startCamera()">

START CAMERA

</button>


</div>


<div class="info">

✋ HELLO MY NAME IS

<br>

☝️ MUHAMMAD

<br>

✌️ ARJUNNAJA

<br>

👍 PROGRAM STUDI

<br>

🤙 INFORMATIKA

</div>


<div class="system">

<span class="online">
● SYSTEM READY
</span>

&nbsp; • &nbsp;

HAND TRACKING

</div>


</div>


<script>


const video =
document.getElementById("video");


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");


const detected =
document.getElementById("detected");


const statusText =
document.getElementById("status");


const startButton =
document.getElementById("startButton");


let camera = null;

let lastGesture = "";

let lastSpeechTime = 0;

let speechUnlocked = false;


const gestureText = {

    hello:
        "hello my name is",

    muhammad:
        "Muhammad",

    arjunnaja:
        "Arjunnaja",

    program:
        "program studi",

    informatika:
        "informatika"

};


function distance(a,b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


function fingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y
        <
        landmarks[pip].y
    );

}


function thumbUp(landmarks) {

    const wrist =
        landmarks[0];

    const tipDistance =
        distance(
            landmarks[4],
            wrist
        );

    const jointDistance =
        distance(
            landmarks[3],
            wrist
        );

    return (
        tipDistance
        >
        jointDistance * 1.15
    );

}


function detectGesture(
    landmarks
) {


    const thumb =
        thumbUp(landmarks);


    const index =
        fingerUp(
            landmarks,
            8,
            6
        );


    const middle =
        fingerUp(
            landmarks,
            12,
            10
        );


    const ring =
        fingerUp(
            landmarks,
            16,
            14
        );


    const pinky =
        fingerUp(
            landmarks,
            20,
            18
        );


    const count =

        (thumb ? 1 : 0)

        +

        (index ? 1 : 0)

        +

        (middle ? 1 : 0)

        +

        (ring ? 1 : 0)

        +

        (pinky ? 1 : 0);


    // ✋ HELLO MY NAME IS

    if (
        count === 5
    ) {

        return "hello";

    }


    // ☝️ MUHAMMAD

    if (

        index &&

        !middle &&

        !ring &&

        !pinky &&

        !thumb

    ) {

        return "muhammad";

    }


    // ✌️ ARJUNNAJA

    if (

        index &&

        middle &&

        !ring &&

        !pinky &&

        !thumb

    ) {

        return "arjunnaja";

    }


    // 👍 PROGRAM STUDI

    if (

        thumb &&

        !index &&

        !middle &&

        !ring &&

        !pinky

    ) {

        return "program";

    }


    // 🤙 INFORMATIKA

    if (

        thumb &&

        pinky &&

        !index &&

        !middle &&

        !ring

    ) {

        return "informatika";

    }


    return null;

}


// ===================================
// SPEECH
// ===================================


function unlockSpeech() {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    speechSynthesis.cancel();


    const test =
        new SpeechSynthesisUtterance("");


    test.volume = 0;


    speechSynthesis.speak(test);


    speechUnlocked = true;

}


function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    if (!speechUnlocked) {

        return;

    }


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(
            text
        );


    voice.lang =
        "en-US";


    voice.rate =
        0.85;


    voice.pitch =
        1;


    voice.volume =
        1;


    speechSynthesis.speak(
        voice
    );

}


// ===================================
// GESTURE RESULT
// ===================================


function showGesture(
    gesture
) {


    if (!gesture) {

        detected.innerText =
            "GESTURE TIDAK DIKENALI";

        return;

    }


    const text =
        gestureText[gesture];


    detected.innerText =
        text;


    const now =
        Date.now();


    if (

        gesture !== lastGesture

        ||

        now - lastSpeechTime
        >
        2500

    ) {


        speak(text);


        lastGesture =
            gesture;


        lastSpeechTime =
            now;

    }

}


// ===================================
// MEDIAPIPE RESULTS
// ===================================


function onResults(
    results
) {


    canvas.width =
        video.videoWidth;


    canvas.height =
        video.videoHeight;


    ctx.clearRect(

        0,

        0,

        canvas.width,

        canvas.height

    );


    if (

        results.multiHandLandmarks

        &&

        results.multiHandLandmarks
            .length > 0

    ) {


        for (
            const landmarks
            of results.multiHandLandmarks
        ) {


            // GARIS TANGAN

            drawConnectors(

                ctx,

                landmarks,

                HAND_CONNECTIONS,

                {

                    color:
                        "#00e5ff",

                    lineWidth:
                        3

                }

            );


            // TITIK LANDMARK

            drawLandmarks(

                ctx,

                landmarks,

                {

                    color:
                        "#ffffff",

                    fillColor:
                        "#00e5ff",

                    lineWidth:
                        2,

                    radius:
                        5

                }

            );


            const gesture =
                detectGesture(
                    landmarks
                );


            showGesture(
                gesture
            );

        }


    }

    else {


        detected.innerText =
            "TUNJUKKAN TANGAN KE KAMERA";


        lastGesture = "";

    }

}


// ===================================
// MEDIAPIPE HANDS
// ===================================


const hands =
new Hands({

    locateFile:
        (file) => {

            return (

                "https://cdn.jsdelivr.net/npm/" +

                "@mediapipe/hands/" +

                file

            );

        }

});


hands.setOptions({

    maxNumHands:
        1,

    modelComplexity:
        1,

    minDetectionConfidence:
        0.6,

    minTrackingConfidence:
        0.6

});


hands.onResults(
    onResults
);


// ===================================
// START CAMERA
// ===================================


function startCamera() {


    unlockSpeech();


    statusText.innerText =
        "Mengaktifkan kamera...";


    if (camera) {

        statusText.innerText =
            "Kamera sudah aktif";

        return;

    }


    camera =
        new Camera(

            video,

            {

                onFrame:
                    async () => {

                        await hands.send({

                            image:
                                video

                        });

                    },


                width:
                    640,


                height:
                    480

            }

        );


    camera.start();


    startButton.innerText =
        "CAMERA ACTIVE";


    statusText.innerText =
        "Kamera aktif • Sistem siap membaca gesture";


}


</script>


</body>

</html>
