<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hand Gesture Recognition</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #050505;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    padding: 18px;
}

/* CAMERA */

.camera-box {
    position: relative;
    width: 100%;
    background: #000;
    overflow: hidden;
    border-radius: 18px;
}

video {
    width: 100%;
    height: auto;
    display: block;
    transform: scaleX(-1);
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: scaleX(-1);
    pointer-events: none;
}

/* LIVE INDICATOR */

.live {
    position: absolute;
    top: 18px;
    left: 18px;

    display: flex;
    align-items: center;
    gap: 8px;

    padding: 9px 13px;

    background: rgba(0,0,0,0.65);
    border-radius: 8px;

    font-size: 13px;
    letter-spacing: 1px;

    z-index: 5;
}

.live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: white;
}

/* RESULT */

.result {
    margin-top: 2px;

    background: #111111;

    border-radius: 0 0 18px 18px;

    padding: 28px 20px 30px;

    text-align: center;
}

.result-label {
    font-size: 12px;
    letter-spacing: 2px;
    color: #888888;
    margin-bottom: 12px;
}

.detected {
    font-size: clamp(25px, 5vw, 42px);
    font-weight: 700;
    letter-spacing: 1px;
    min-height: 50px;
}

.status {
    margin-top: 18px;

    padding-top: 18px;

    border-top: 1px solid #333333;

    color: #aaaaaa;

    font-size: 14px;
}

/* BUTTON */

button {
    margin-top: 24px;

    padding: 14px 28px;

    border: none;
    border-radius: 10px;

    background: #ffffff;
    color: #050505;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.2s ease;
}

button:hover {
    background: #dddddd;
}

button:active {
    transform: scale(0.97);
}

button:disabled {
    opacity: 0.6;
    cursor: default;
}

/* GESTURE LIST */

.gesture-list {

    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 10px;

    margin-top: 22px;

    padding-bottom: 20px;
}

.gesture {

    text-align: center;

    padding: 12px 5px;

    color: #ffffff;
}

.gesture-icon {

    font-size: 30px;

    margin-bottom: 10px;

    filter: grayscale(1);
}

.gesture-name {

    font-size: 11px;

    letter-spacing: 0.8px;

    color: #aaaaaa;

    line-height: 1.4;
}

/* MOBILE */

@media (max-width: 600px) {

    .container {
        padding: 10px;
    }

    .camera-box {
        border-radius: 14px;
    }

    .result {
        padding: 24px 15px 28px;
    }

    .gesture-list {
        gap: 2px;
    }

    .gesture-icon {
        font-size: 25px;
    }

    .gesture-name {
        font-size: 9px;
    }

    .live {
        top: 12px;
        left: 12px;
        font-size: 11px;
        padding: 7px 10px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- CAMERA -->

    <div class="camera-box">

        <video
            id="video"
            autoplay
            playsinline
            muted>
        </video>

        <canvas id="canvas"></canvas>

        <div class="live">
            <span class="live-dot"></span>
            LIVE
        </div>

    </div>


    <!-- RESULT -->

    <div class="result">

        <div class="result-label">
            DETECTED GESTURE
        </div>

        <div
            id="detected"
            class="detected">
            Tunjukkan tangan
        </div>

        <div
            id="status"
            class="status">
            Tekan tombol untuk mengaktifkan kamera
        </div>

        <button
            id="startButton"
            onclick="startCamera()">
            START CAMERA
        </button>

    </div>


    <!-- GESTURE GUIDE -->

    <div class="gesture-list">

        <div class="gesture">
            <div class="gesture-icon">✋</div>
            <div class="gesture-name">
                HELLO MY NAME IS
            </div>
        </div>

        <div class="gesture">
            <div class="gesture-icon">☝️</div>
            <div class="gesture-name">
                MUHAMMAD
            </div>
        </div>

        <div class="gesture">
            <div class="gesture-icon">✌️</div>
            <div class="gesture-name">
                ARJUNNAJA
            </div>
        </div>

        <div class="gesture">
            <div class="gesture-icon">👍</div>
            <div class="gesture-name">
                PROGRAM STUDI
            </div>
        </div>

        <div class="gesture">
            <div class="gesture-icon">🤙</div>
            <div class="gesture-name">
                INFORMATIKA
            </div>
        </div>

    </div>

</div>


<script>

/* =========================
   ELEMENT
========================= */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const detected =
    document.getElementById("detected");

const statusText =
    document.getElementById("status");

const startButton =
    document.getElementById("startButton");


/* =========================
   GESTURE DATA
========================= */

const gestureText = {

    hello:
        "HELLO MY NAME IS",

    muhammad:
        "MUHAMMAD",

    arjunnaja:
        "ARJUNNAJA",

    program:
        "PROGRAM STUDI",

    informatika:
        "INFORMATIKA"

};


/* =========================
   VARIABLES
========================= */

let camera = null;

let cameraStarted = false;

let lastGesture = "";

let lastSpeechTime = 0;


/* =========================
   DISTANCE
========================= */

function distance(a, b) {

    return Math.sqrt(

        Math.pow(a.x - b.x, 2) +

        Math.pow(a.y - b.y, 2)

    );

}


/* =========================
   FINGER DETECTION
========================= */

function fingerUp(
    landmarks,
    tip,
    pip
) {

    return (
        landmarks[tip].y <
        landmarks[pip].y
    );

}


/* =========================
   THUMB DETECTION
========================= */

function thumbUp(landmarks) {

    const wrist =
        landmarks[0];

    const tipDistance =
        distance(
            landmarks[4],
            wrist
        );

    const ipDistance =
        distance(
            landmarks[3],
            wrist
        );

    return (
        tipDistance >
        ipDistance * 1.15
    );

}


/* =========================
   GESTURE RECOGNITION
========================= */

function detectGesture(landmarks) {

    const thumb =
        thumbUp(landmarks);

    const index =
        fingerUp(
            landmarks,
            8,
            6
        );

    const middle =
        fingerUp(
            landmarks,
            12,
            10
        );

    const ring =
        fingerUp(
            landmarks,
            16,
            14
        );

    const pinky =
        fingerUp(
            landmarks,
            20,
            18
        );


    const count =

        (thumb ? 1 : 0) +

        (index ? 1 : 0) +

        (middle ? 1 : 0) +

        (ring ? 1 : 0) +

        (pinky ? 1 : 0);


    /* ✋ */

    if (count === 5) {

        return "hello";

    }


    /* ☝️ */

    if (

        index &&

        !middle &&

        !ring &&

        !pinky &&

        !thumb

    ) {

        return "muhammad";

    }


    /* ✌️ */

    if (

        index &&

        middle &&

        !ring &&

        !pinky &&

        !thumb

    ) {

        return "arjunnaja";

    }


    /* 👍 */

    if (

        thumb &&

        !index &&

        !middle &&

        !ring &&

        !pinky

    ) {

        return "program";

    }


    /* 🤙 */

    if (

        thumb &&

        pinky &&

        !index &&

        !middle &&

        !ring

    ) {

        return "informatika";

    }


    return null;

}


/* =========================
   TEXT TO SPEECH
========================= */

function speak(text) {

    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(text);


    voice.lang = "en-US";

    voice.rate = 0.9;

    voice.pitch = 1;

    voice.volume = 1;


    speechSynthesis.speak(voice);

}


/* =========================
   SHOW GESTURE
========================= */

function showGesture(gesture) {

    if (!gesture) {

        detected.innerText =
            "Gesture tidak dikenali";

        return;

    }


    const text =
        gestureText[gesture];


    detected.innerText =
        text;


    const now =
        Date.now();


    /*
       Suara hanya keluar ketika
       gesture berubah atau
       sudah lebih dari 2.5 detik.
    */

    if (

        gesture !== lastGesture ||

        now - lastSpeechTime >
        2500

    ) {

        speak(text);

        lastGesture =
            gesture;

        lastSpeechTime =
            now;

    }

}


/* =========================
   MEDIAPIPE RESULTS
========================= */

function onResults(results) {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {

        return;

    }


    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(

        0,
        0,
        canvas.width,
        canvas.height

    );


    if (

        results.multiHandLandmarks &&

        results.multiHandLandmarks.length >

        0

    ) {


        const landmarks =
            results.multiHandLandmarks[0];


        /*
           GARIS TANGAN
           PUTIH
        */

        drawConnectors(

            ctx,

            landmarks,

            HAND_CONNECTIONS,

            {

                color: "#ffffff",

                lineWidth: 3

            }

        );


        /*
           TITIK TANGAN
           HITAM + PUTIH
        */

        drawLandmarks(

            ctx,

            landmarks,

            {

                color: "#ffffff",

                fillColor: "#050505",

                lineWidth: 2,

                radius: 5

            }

        );


        const gesture =
            detectGesture(
                landmarks
            );


        showGesture(
            gesture
        );


    } else {

        detected.innerText =
            "Tunjukkan tangan";


        lastGesture = "";

    }

}


/* =========================
   MEDIAPIPE HANDS
========================= */

const hands = new Hands({

    locateFile: (file) => {

        return (

            "https://cdn.jsdelivr.net/npm/" +

            "@mediapipe/hands/" +

            file

        );

    }

});


hands.setOptions({

    maxNumHands: 1,

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


hands.onResults(
    onResults
);


/* =========================
   START CAMERA
========================= */

async function startCamera() {

    if (cameraStarted) {

        return;

    }


    startButton.disabled = true;

    startButton.innerText =
        "CAMERA ACTIVE";


    statusText.innerText =
        "Mengaktifkan kamera...";


    /*
       AKTIFKAN SUARA
       SAAT TOMBOL DITEKAN
    */

    if (
        "speechSynthesis" in window
    ) {

        speechSynthesis.cancel();

        const unlock =
            new SpeechSynthesisUtterance("");

        unlock.volume = 0;

        speechSynthesis.speak(
            unlock
        );

    }


    try {

        /*
           CAMERA MEDIAPIPE
        */

        camera =
            new Camera(

                video,

                {

                    onFrame:
                        async () => {

                            await hands.send({

                                image:
                                    video

                            });

                        },

                    width: 640,

                    height: 480

                }

            );


        camera.start();


        cameraStarted = true;


        statusText.innerText =
            "Kamera aktif • Sistem siap membaca gesture";


    }

    catch (error) {

        console.error(error);


        statusText.innerText =
            "Kamera tidak dapat diakses";


        startButton.disabled =
            false;

        startButton.innerText =
            "START CAMERA";


        cameraStarted =
            false;

    }

}

</script>

</body>
</html>
