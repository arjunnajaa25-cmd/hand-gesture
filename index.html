<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture</title>

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #00ff66;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    h1 {
      margin-top: 25px;
      font-size: 28px;
    }

    #camera {
      width: 90%;
      max-width: 700px;
      border: 2px solid #00ff66;
      border-radius: 15px;
      transform: scaleX(-1);
    }

    #result {
      font-size: 32px;
      font-weight: bold;
      margin-top: 20px;
    }

    #fingers {
      font-size: 18px;
      margin-top: 10px;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #00ff66;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>HAND GESTURE</h1>

  <video id="camera" autoplay playsinline></video>

  <div id="result">Tekan tombol untuk mulai</div>
  <div id="fingers">Fingers: -</div>

  <button onclick="startCamera()">START CAMERA</button>

  <script>
    const video = document.getElementById("camera");
    const result = document.getElementById("result");
    const fingersText = document.getElementById("fingers");

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user"
          },
          audio: false
        });

        video.srcObject = stream;

        result.innerText = "Camera aktif!";
        fingersText.innerText = "Fingers: belum dideteksi";

      } catch (error) {
        result.innerText = "Kamera tidak bisa dibuka";
        console.error(error);
      }
    }
  </script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const handDetector = new Hands({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

handDetector.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

handDetector.onResults((results) => {
  if (!results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0) {
    console.log("Tangan belum terlihat");
    return;
  }

  const hand = results.multiHandLandmarks[0];

  let fingers = 0;

  // Telunjuk
  if (hand[8].y < hand[6].y) {
    fingers++;
  }

  // Jari tengah
  if (hand[12].y < hand[10].y) {
    fingers++;
  }

  // Jari manis
  if (hand[16].y < hand[14].y) {
    fingers++;
  }

  // Kelingking
  if (hand[20].y < hand[18].y) {
    fingers++;
  }

  // Ibu jari
  if (Math.abs(hand[4].x - hand[2].x) > 0.08) {
    fingers++;
  }

  console.log("Jari terdeteksi:", fingers);

  const fingersText = document.getElementById("fingersText");

  if (fingersText) {
    fingersText.innerText = "Fingers: " + fingers;
  }

  const result = document.getElementById("result");

  if (result) {
    if (fingers === 1) {
      result.innerText = "MY NAME IS";
    } else if (fingers === 2) {
      result.innerText = "ARJUNNAJA";
    } else {
      result.innerText = "Tunjukkan gesture";
    }
  }
});

// Baca gambar dari kamera yang SUDAH ADA
async function detectHand() {
  if (video.readyState >= 2) {
    await handDetector.send({ image: video });
  }

  requestAnimationFrame(detectHand);
}

detectHand();
</script>

</body>
</html>
